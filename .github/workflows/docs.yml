name: Build and deploy docs

on:
  push:
    branches: [main, master]
  # allows to launch manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocstrings-matlab \
            pymdown-extensions

      - name: Build and deploy
        run: mkdocs gh-deploy --force